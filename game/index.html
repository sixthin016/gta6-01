<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Bay — a 3D open-world crime story</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2b4a8f;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  canvas { position: fixed; inset: 0; display: block; touch-action: none; z-index: 0; }
  #hud { position: fixed; inset: 0; pointer-events: none; color: #fff; z-index: 2; }
  .panel { position: absolute; background: rgba(10,20,30,0.82); border-radius: 10px;
    padding: 10px 14px; }
  .tl { top: 14px; left: 14px; width: 230px; }
  .cash { color: #7dff8a; font-weight: 800; font-size: 26px; }
  .bar { margin-top: 6px; height: 12px; border-radius: 6px; background: rgba(255,255,255,0.25); overflow: hidden; }
  .bar .fill { height: 100%; background: #7dff8a; }
  .bar.small { height: 8px; margin-top: 3px; }
  .bar .fill.gold { background: #ffd700; }
  .respect { margin-top: 8px; font-size: 13px; font-weight: 700; color: #ffd700; }
  .district { margin-top: 6px; font-size: 13px; font-weight: 700; }
  .tr { top: 14px; right: 14px; text-align: right; }
  .stars { color: #ffd700; font-size: 26px; font-weight: 800; letter-spacing: 2px; }
  .clock { font-size: 15px; font-weight: 700; margin-top: 2px; }
  .storm { font-size: 14px; font-weight: 800; color: #ff8c42; margin-top: 2px; }
  .radio { font-size: 12px; font-weight: 600; color: #cfe8ff; margin-top: 2px; }
  .tc { top: 14px; left: 50%; transform: translateX(-50%); color: #ffd700;
    font-weight: 700; font-size: 14px; max-width: 44vw; text-align: center; }
  .bl { bottom: 14px; left: 14px; font-size: 15px; font-weight: 600; }
  .perks { color: #7dff8a; font-size: 13px; }
  #minimap { position: absolute; top: auto; left: auto; right: 14px; bottom: 14px; width: 220px; height: 220px; z-index: 2;
    border-radius: 10px; border: 2px solid rgba(255,255,255,0.5); background: #2f7d32; }
  .toast { position: absolute; left: 50%; bottom: 190px; transform: translateX(-50%);
    background: rgba(10,20,30,0.65); border-radius: 10px; padding: 8px 16px;
    font-weight: 700; font-size: 16px; }
  .banner { position: absolute; left: 50%; bottom: 140px; transform: translateX(-50%);
    background: rgba(20,16,40,0.78); border-radius: 10px; padding: 12px 20px;
    color: #ffd700; font-weight: 700; font-size: 15px; max-width: 660px; text-align: center; }
  .title { position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    background: rgba(8,12,28,0.45); }
  .title h1 { font-size: 96px; font-weight: 900; margin: 0;
    background: linear-gradient(180deg, #ffe259, #ff7a1a 55%, #ff2e88);
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  .title p { font-size: 22px; font-weight: 600; margin: 10px 0; }
  .title .card { background: rgba(10,20,30,0.7); border-radius: 14px; padding: 20px 28px;
    font-size: 17px; line-height: 1.7; margin-top: 18px; }
  .title .dim { color: #cfe8ff; font-size: 15px; font-weight: 400; }
  .muted { position: absolute; top: 150px; right: 14px; color: #ffd700; font-weight: 700; }
  .wheel { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    display: flex; gap: 12px; background: rgba(10,20,30,0.75); border-radius: 16px; padding: 18px; }
  .wheel-item { background: rgba(255,255,255,0.1); border-radius: 10px; padding: 12px 16px;
    text-align: center; font-size: 14px; min-width: 90px; }
  .wheel-item.sel { background: rgba(255,215,0,0.35); outline: 2px solid #ffd700; }
  .wheel-hint { align-self: center; font-size: 13px; color: #cfe8ff; }
  .garage { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    background: rgba(10,20,30,0.88); border-radius: 16px; padding: 20px 26px; width: 420px; }
  .garage h3 { margin: 0 0 12px; color: #ffd700; }
  .g-row { display: flex; justify-content: space-between; padding: 8px 0;
    border-bottom: 1px solid rgba(255,255,255,0.15); font-size: 15px; }
  .g-cost { color: #7dff8a; font-weight: 700; }
  .garage .dim { margin-top: 10px; color: #cfe8ff; font-size: 13px; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip-path: inset(50%); white-space: nowrap; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
</head>
<body>
<div id="hud"></div>
<canvas id="minimap" width="220" height="220" aria-label="Minimap of Neon Bay"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
