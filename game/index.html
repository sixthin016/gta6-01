<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Bay — open-world crime game</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #0e0a18;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
