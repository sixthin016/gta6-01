<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Bay — a GTA 6-style open world</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1a0f2e; }
  canvas { display: block; }
  #fallback { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; color: #fff; font-family: Arial, sans-serif; text-align: center; padding: 20px; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.min.js"
  }
}

</head>
<body>
<div id="fallback"><div><h1>NEON BAY</h1><p>This game needs WebGL. Please open it in a desktop browser with hardware acceleration.</p></div></div>
<script type="module">
  import { Game } from './src/main.js';
  try {
    const game = new Game();
    game.init();
  } catch (err) {
    document.getElementById('fallback').style.display = 'flex';
    console.error(err);
  }
</script>
